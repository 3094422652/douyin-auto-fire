name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/keepalive.yml"
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/keepalive.yml"
      - "docs/**"
      - "README.md"

permissions: {}

jobs:
  verify-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install pyyaml
      - name: Validate workflow YAML and embedded Python hooks
        run: |
          python -W error::SyntaxWarning - <<'PY'
          import ast
          import importlib.util
          import textwrap
          from pathlib import Path
          import yaml

          for wf in Path(".github/workflows").glob("*.yml"):
              raw = wf.read_text(encoding="utf-8")
              bad = [ord(c) for c in raw if ord(c) < 32 and c not in ("\n", "\t", "\r")]
              assert not bad, f"{wf} contains control chars: {bad}"
              yaml.safe_load(raw)

          send_yml = yaml.safe_load(Path(".github/workflows/send.yml").read_text(encoding="utf-8"))
          assert send_yml["permissions"] == {}
          steps = send_yml["jobs"]["send"]["steps"]

          inject = next(s for s in steps if "sitecustomize.py" in str(s.get("name")))["run"]
          sc_src = inject.split("cat << 'EOF' > \"$HOOK_DIR/sitecustomize.py\"\n", 1)[1].rsplit("\nEOF\n", 1)[0]
          compile(sc_src, "sitecustomize.py", "exec", dont_inherit=True)

          persist = next(s for s in steps if "Persist quote-state" in str(s.get("name")))["run"]
          mg_raw = persist.split("cat << 'PY' > /tmp/merge_quote_state.py\n", 1)[1].rsplit("\nPY\n", 1)[0]
          mg_src = textwrap.dedent(mg_raw)
          compile(mg_src, "merge_quote_state.py", "exec", dont_inherit=True)

          tmp = Path("/tmp/_ci_sc_verify.py")
          tmp.write_text(sc_src, encoding="utf-8")
          spec = importlib.util.spec_from_file_location("_ci_sc_verify", str(tmp))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod._MAX_QUOTE_LEN == 200
          assert mod._format_author("爱因斯坦", "佚名") == "爱因斯坦"
          assert mod._format_author("莎士比亚", "戏剧《暴风雨》") == "莎士比亚·戏剧《暴风雨》"
          assert "xygeng" not in sc_src and "SweetNothings" not in sc_src
          print("Workflow YAML & embedded Python verification passed!")
          PY

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check if app or tests changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_pytest=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -Eq '^(app/|tests/|run\.py|requirements)'; then
            echo "run_pytest=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pytest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: steps.changes.outputs.run_pytest == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - if: steps.changes.outputs.run_pytest == 'true'
        run: pip install -r requirements-dev.txt
      - if: steps.changes.outputs.run_pytest == 'true'
        run: python -m playwright install chromium
      - if: steps.changes.outputs.run_pytest == 'true'
        run: python -m pytest -q
