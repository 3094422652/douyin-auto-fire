name: Sync Code to CNB

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync main and tags to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "CNB_TOKEN not configured. Skipping sync."
            exit 0
          fi
          cat > "$RUNNER_TEMP/cnb-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo "cnb" ;;
            *Password*) echo "$CNB_TOKEN" ;;
          esac
          EOF

          chmod +x "$RUNNER_TEMP/cnb-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/cnb-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          git remote add cnb https://cnb.cool/1mev/douyin-auto-fire.git
          git fetch cnb main
          git push --force-with-lease cnb HEAD:main
          git push cnb --tags
