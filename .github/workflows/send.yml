name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "1 16 * * *"

# 顶层权限显式置空（最小权限原则，防 GITHUB_TOKEN 默认写权限滥用）
permissions: {}

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json

      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              print("未配置多账号 Secret，使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时存在"
                  )
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Start Xray Proxy Tunnel (Scheme B)
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          set -e
          if [ -z "$XRAY_CONFIG" ]; then
            echo "::error::未检测到 XRAY_CONFIG Secret，为防止原生机房 IP 暴露，任务已强制熔断终止！"
            exit 1
          fi

          echo "[1/3] 正在下载并校验 Xray-core (v26.3.27)..."
          XRAY_VER="v26.3.27"
          XRAY_SHA256="23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
          wget -q -O /tmp/Xray-linux-64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  /tmp/Xray-linux-64.zip" | sha256sum -c -
          unzip -q -o /tmp/Xray-linux-64.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

          echo "[2/3] 正在写入配置并启动本地 SOCKS5 隧道 (127.0.0.1:10808)..."
          echo "$XRAY_CONFIG" > /tmp/xray/config.json
          nohup /tmp/xray/xray run -c /tmp/xray/config.json >/tmp/xray/xray.log 2>&1 &
          sleep 3

          echo "[3/3] 正在校验代理隧道连通性与出口 IP..."
          if ! PROXY_IP=$(curl -sS --fail --max-time 12 --retry 2 --socks5-hostname 127.0.0.1:10808 https://api.ip.sb/ip 2>/dev/null || curl -sS --fail --max-time 12 --retry 2 --socks5-hostname 127.0.0.1:10808 https://icanhazip.com 2>/dev/null); then
            echo "::error::Xray 代理隧道连接失败！以下为 Xray 运行日志："
            cat /tmp/xray/xray.log
            exit 1
          fi
          echo "::add-mask::$PROXY_IP"
          echo "代理隧道校验通过！当前加密出口 IP: ${PROXY_IP}"

      - name: Inject Zero-Intrusion Playwright Proxy Hook (sitecustomize.py)
        run: |
          set -e
          HOOK_DIR="/tmp/pw_proxy_hook"
          mkdir -p "$HOOK_DIR"

          cat << 'EOF' > "$HOOK_DIR/sitecustomize.py"
          import os
          import sys
          import asyncio
          import random

          def _install_playwright_proxy_hook():
              proxy_url = os.environ.get("LOCAL_XRAY_PROXY", "socks5://127.0.0.1:10808").strip()
              if not proxy_url:
                  return
              try:
                  import playwright._impl._browser_type as _bt
              except ImportError:
                  return

              _orig_launch = _bt.BrowserType.launch
              _orig_launch_persistent = _bt.BrowserType.launch_persistent_context

              async def _patched_launch(self, *args, **kwargs):
                  if not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch 已强制绑定本地 Xray 隧道: {proxy_url}", flush=True)
                  if "args" not in kwargs or not kwargs["args"]:
                      kwargs["args"] = []
                  if "--disable-blink-features=AutomationControlled" not in kwargs["args"]:
                      kwargs["args"].append("--disable-blink-features=AutomationControlled")
                  return await _orig_launch(self, *args, **kwargs)

              async def _patched_launch_persistent(self, *args, **kwargs):
                  if not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch_persistent_context 已强制绑定本地 Xray 隧道: {proxy_url}", flush=True)
                  if "args" not in kwargs or not kwargs["args"]:
                      kwargs["args"] = []
                  if "--disable-blink-features=AutomationControlled" not in kwargs["args"]:
                      kwargs["args"].append("--disable-blink-features=AutomationControlled")
                  return await _orig_launch_persistent(self, *args, **kwargs)

              _bt.BrowserType.launch = _patched_launch
              _bt.BrowserType.launch_persistent_context = _patched_launch_persistent

          def _install_humanized_sender_hook():
              try:
                  import app.sender as _sender
                  from app.douyin import PageOperationError
              except ImportError:
                  return

              def _fetch_quote():
                  import urllib.request as _req
                  import json as _json

                  timeout = 2.5
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

                  # 1. 第一优先：一言 (Hitokoto 纯现代治愈 / 影视台词 / 网易云热评，排除古诗词)
                  try:
                      r = _req.Request("https://v1.hitokoto.cn/?c=d&c=e&c=h&c=j&c=k&max_length=28", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          h = data.get("hitokoto", "").strip()
                          auth = data.get("from_who") or data.get("from")
                          text = f"{h} —— {auth}" if (auth and len(h) + len(auth) < 30) else h
                          if text:
                              print(f"[QuoteFetcher] 命中优先级 1: 一言·现代治愈 -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] 优先级 1 一言异常 ({type(e).__name__})，切换优先级 2", flush=True)

                  # 2. 第二优先：xygeng 壹思 API (现代生活哲学与情感励志金句)
                  try:
                      r = _req.Request("https://api.xygeng.cn/one", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          text = (data.get("data", {}).get("content") or "").strip()
                          if text:
                              print(f"[QuoteFetcher] 命中优先级 2: xygeng 壹思 API -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] 优先级 2 xygeng 壹思异常 ({type(e).__name__})，切换优先级 3", flush=True)

                  # 3. 第三优先：每日暖心短句 API (SweetNothings 温情日常短句)
                  try:
                      r = _req.Request("https://api.lovelive.tools/api/SweetNothings", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          text = resp.read().decode("utf-8").strip()
                          if text:
                              print(f"[QuoteFetcher] 命中优先级 3: 每日暖心短句 -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] 优先级 3 每日暖心短句异常 ({type(e).__name__})，切换优先级 4", flush=True)

                  # 4. 第四优先：金山词霸·每日一句 (现代名言/电影台词地道中文译文)
                  try:
                      r = _req.Request("https://open.iciba.com/dsapi/", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          zh = data.get("note", "").strip()
                          en = data.get("content", "").strip()
                          text = f"{en}（{zh}）" if (en and zh and len(en) + len(zh) < 45) else (zh or en)
                          if text:
                              print(f"[QuoteFetcher] 命中优先级 4: 金山词霸每日一句 -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] 优先级 4 金山词霸异常 ({type(e).__name__})，启动本地精选现代词库", flush=True)

                  fallback_pool = [
                      "去热爱生活，去奔赴山海。",
                      "愿你历尽千帆，归来仍是少年。",
                      "生活原本沉闷，但跑起来就有风。",
                      "日落尤其温柔，人间皆是浪漫。",
                      "知足且上进，温柔且坚定。",
                      "春来夏往，秋收冬藏，我们来日方长。",
                      "满怀希望，就会所向披靡。",
                      "生活明朗，万物可爱，人间值得，未来可期。"
                  ]
                  fb = random.choice(fallback_pool)
                  print(f"[QuoteFetcher] 命中本地精选纯现代词库 -> {fb}", flush=True)
                  return fb

              _orig_send_message = _sender.send_message

              async def _patched_send_message(page, chat, message, stickers):
                  if message.type == "text" and message.content:
                      val = message.content
                      if "[API]" in val or "[一言]" in val or val == "一言" or "[金句]" in val:
                          q = _fetch_quote()
                          val = val.replace("[API]", q).replace("[一言]", q).replace("[金句]", q) if ("[API]" in val or "[一言]" in val or "[金句]" in val) else q
                          message = type(message)(type="text", content=val)
                          print(f"[HumanizeHook] 动态解析金句内容: {val}", flush=True)
                  return await _orig_send_message(page, chat, message, stickers)

              async def _patched_send_text(chat, content):
                  editor = await chat.message_input()
                  page = editor.page
                  await editor.click()
                  await asyncio.sleep(random.uniform(0.6, 1.2))

                  # 拟真打字节奏输入
                  for char in content:
                      await page.keyboard.type(char)
                      if char in "，。！？；、,.!?":
                          await asyncio.sleep(random.uniform(0.35, 0.55))
                      else:
                          await asyncio.sleep(random.uniform(0.12, 0.25))

                  try:
                      await page.wait_for_function(
                          """([txt]) => {
                              const es = [...document.querySelectorAll('[class*=messageEditor] [contenteditable=true], .messageEditorinputArea')];
                              return es.some(e => (e.innerText || '').includes(txt));
                          }""",
                          arg=[content],
                          timeout=5000,
                      )
                  except Exception as exc:
                      raise PageOperationError("输入未写入编辑框") from exc

                  await asyncio.sleep(random.uniform(1.0, 1.8))

                  before = await _sender._mark_latest_outgoing_message(page)
                  await page.wait_for_timeout(300)
                  await _sender._trigger_send(page)
                  await _sender._confirm_outgoing_message(page, before, label="文本", expected_text=content)

              _sender.send_message = _patched_send_message
              _sender.send_text = _patched_send_text
              print("[HumanizeHook] 已无侵入挂载纯现代多源金句与拟人化慢速打字防风控逻辑", flush=True)

          _install_playwright_proxy_hook()
          _install_humanized_sender_hook()
          EOF

          echo "PYTHONPATH=${HOOK_DIR}:${PYTHONPATH}" >> "$GITHUB_ENV"
          echo "LOCAL_XRAY_PROXY=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"

          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])" 2>/dev/null || true)
          if [ -n "$SITE_PKG" ] && [ -d "$SITE_PKG" ]; then
            cp "$HOOK_DIR/sitecustomize.py" "$SITE_PKG/sitecustomize.py"
          fi
          echo "sitecustomize.py 零侵入代理与拟人化钩子注入完成！"

      - name: Randomized execution jitter (00:01 - 00:03)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # 仅在每天定时触发时执行，随机等待 0 ~ 120 秒（在 00:01 到 00:03 之间随机拟人化执行）
          JITTER_SEC=$(( RANDOM % 121 ))
          echo "拟人化随机延时防风控：本次任务随机延后 ${JITTER_SEC} 秒后启动浏览器..."
          sleep "$JITTER_SEC"

      - name: Run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IS_DRY_RUN" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Encrypt diagnostics artifacts (7-Zip AES-256)
        if: failure()
        shell: bash
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          set -e
          # 1. 彻底移除包含 Cookie/网络请求头的 Playwright trace 抓包，防止凭据外泄
          rm -rf artifacts/traces

          # 2. 检查是否有需要加密上传的诊断文件
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "无诊断文件生成，跳过加密打包"
            exit 0
          fi

          # 3. 安全熔断：未配置密码则严禁明文上传
          if [ -z "$ARTIFACT_PASSWORD" ]; then
            echo "::warning::未检测到 ARTIFACT_PASSWORD 密钥，为防止明文泄露，已自动阻断附件上传！"
            rm -rf artifacts
            exit 0
          fi

          # 4. 确保 7-Zip (7z) 工具就绪
          if ! command -v 7z &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          fi

          # 5. 使用 7-Zip 进行 AES-256 全量加密打包（-mhe=on 开启文件名头部强加密）
          mkdir -p /tmp/encrypted_out
          7z a -t7z -p"$ARTIFACT_PASSWORD" -mhe=on -mx=9 /tmp/encrypted_out/diagnostics.7z ./artifacts/*
          
          # 清除原始明文目录
          rm -rf artifacts
          echo "诊断产物已成功通过 AES-256 强加密打包（文件名已隐藏）！"

      - name: Upload encrypted diagnostics
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: douyin-encrypted-diagnostics-${{ github.run_id }}
          path: /tmp/encrypted_out/diagnostics.7z
          retention-days: 3
