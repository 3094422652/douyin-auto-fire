name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "50 23 * * *"

# 顶层权限显式置空（最小权限原则，防 GITHUB_TOKEN 默认写权限滥用）
permissions: {}

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
      TZ: "Asia/Shanghai"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json

      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              print("未配置多账号 Secret，使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时存在"
                  )
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Start Xray Proxy Tunnel (Scheme B)
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          set -e
          if [ -z "$XRAY_CONFIG" ]; then
            echo "::error::未检测到 XRAY_CONFIG Secret，为防止原生机房 IP 暴露，任务已强制熔断终止！"
            exit 1
          fi

          echo "[1/3] 正在下载并校验 Xray-core (v26.3.27)..."
          XRAY_VER="v26.3.27"
          XRAY_SHA256="23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
          wget -q -O /tmp/Xray-linux-64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  /tmp/Xray-linux-64.zip" | sha256sum -c -
          unzip -q -o /tmp/Xray-linux-64.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

          echo "[2/3] 正在写入配置并启动本地 SOCKS5 隧道 (127.0.0.1:10808)..."
          echo "$XRAY_CONFIG" > /tmp/xray/config.json
          nohup /tmp/xray/xray run -c /tmp/xray/config.json >/tmp/xray/xray.log 2>&1 &
          sleep 3

          echo "[3/3] 正在校验代理隧道连通性与出口 IP..."
          if ! PROXY_IP=$(curl -sS --fail --max-time 12 --retry 2 --socks5-hostname 127.0.0.1:10808 https://api.ip.sb/ip 2>/dev/null || curl -sS --fail --max-time 12 --retry 2 --socks5-hostname 127.0.0.1:10808 https://icanhazip.com 2>/dev/null); then
            echo "::error::Xray 代理隧道连接失败！以下为 Xray 运行日志："
            cat /tmp/xray/xray.log
            exit 1
          fi
          PROXY_IP=$(echo "$PROXY_IP" | tr -d '\r\n[:space:]')
          echo "::add-mask::$PROXY_IP"
          echo "代理隧道校验通过！当前加密出口 IP: ${PROXY_IP}"

      - name: Inject Zero-Intrusion Playwright Proxy Hook (sitecustomize.py)
        run: |
          set -e
          HOOK_DIR="/tmp/pw_proxy_hook"
          mkdir -p "$HOOK_DIR"

          cat << 'EOF' > "$HOOK_DIR/sitecustomize.py"
          import os
          import sys
          import asyncio
          import random
          import re

          def _install_playwright_proxy_hook():
              proxy_url = os.environ.get("LOCAL_XRAY_PROXY", "socks5://127.0.0.1:10808").strip()
              try:
                  import playwright._impl._browser_type as _bt
                  import playwright._impl._browser as _br
              except ImportError:
                  return

              _orig_launch = _bt.BrowserType.launch
              _orig_launch_persistent = _bt.BrowserType.launch_persistent_context
              _orig_new_context = _br.Browser.new_context

              async def _patched_launch(self, *args, **kwargs):
                  if proxy_url and not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch -> {proxy_url}", flush=True)
                  kwargs["args"] = list(kwargs.get("args") or [])
                  if "--disable-blink-features=AutomationControlled" not in kwargs["args"]:
                      kwargs["args"].append("--disable-blink-features=AutomationControlled")
                  return await _orig_launch(self, *args, **kwargs)

              async def _patched_launch_persistent(self, *args, **kwargs):
                  if proxy_url and not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch_persistent_context -> {proxy_url}", flush=True)
                  if not kwargs.get("timezoneId"):
                      kwargs["timezoneId"] = "Asia/Shanghai"
                      print("[ProxyHook] Injected timezone_id -> Asia/Shanghai", flush=True)
                  kwargs["args"] = list(kwargs.get("args") or [])
                  if "--disable-blink-features=AutomationControlled" not in kwargs["args"]:
                      kwargs["args"].append("--disable-blink-features=AutomationControlled")
                  return await _orig_launch_persistent(self, *args, **kwargs)

              async def _patched_new_context(self, *args, **kwargs):
                  if not kwargs.get("timezoneId"):
                      kwargs["timezoneId"] = "Asia/Shanghai"
                      print("[ProxyHook] Injected timezone_id -> Asia/Shanghai", flush=True)
                  return await _orig_new_context(self, *args, **kwargs)

              _bt.BrowserType.launch = _patched_launch
              _bt.BrowserType.launch_persistent_context = _patched_launch_persistent
              _br.Browser.new_context = _patched_new_context

              try:
                  import app.browser as _app_browser

                  async def _patched_first_visible_selector(page, selectors, timeout_ms):
                      if not selectors:
                          return None
                      rounds = 3 if timeout_ms >= 3000 else 1
                      step_ms = max(250, timeout_ms // (rounds * len(selectors)))
                      for _ in range(rounds):
                          for selector in selectors:
                              try:
                                  await page.locator(selector).first.wait_for(state="visible", timeout=step_ms)
                                  return selector
                              except Exception:
                                  continue
                      return None

                  _app_browser._first_visible_selector = _patched_first_visible_selector
              except ImportError:
                  pass

          def _install_humanized_sender_hook():
              try:
                  import app.sender as _sender
                  from app.douyin import PageOperationError
              except ImportError:
                  return

              def _clean_text(s):
                  if not s:
                      return ""
                  s = re.sub(r"\s+", " ", s).strip()
                  for ch in ("\u201c", "\u201d", "\"", "\u300c", "\u300d", "\u300e", "\u300f"):
                      s = s.strip(ch)
                  return s.strip()

              def _format_author(who, frm):
                  who = (who or "").strip()
                  frm = (frm or "").strip()
                  if who in ("null", "None", "\u4f5a\u540d"):
                      who = ""
                  if frm in ("null", "None", "\u539f\u521b", "\u7f51\u7edc", "\u4e00\u4e2a\u9ad8\u4e09"):
                      frm = ""
                  for ch in ("\u300a", "\u300b", "<", ">"):
                      if frm.startswith(ch) and frm.endswith(ch):
                          frm = frm[1:-1].strip()
                      if who.startswith(ch) and who.endswith(ch):
                          who = who[1:-1].strip()
                  if who and frm and who != frm:
                      return f"{who}\u300a{frm}\u300b"
                  return who or frm

              def _fetch_quote():
                  import urllib.request as _req
                  import json as _json

                  timeout = 2.5
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

                  # 1. P1: Hitokoto (categories: d, f, h, k, max_length=100 - exclude anime a/b, original e, jokes l, poetry i)
                  try:
                      r = _req.Request("https://v1.hitokoto.cn/?c=d&c=f&c=h&c=k&max_length=100", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          h = _clean_text(data.get("hitokoto", ""))
                          auth = _clean_text(_format_author(data.get("from_who"), data.get("from")))
                          if auth:
                              for ch in ("\u3002", "\uff01", "!", "."):
                                  if h.endswith(ch):
                                      h = h[:-1]
                              text = f"{h} \u2014\u2014 {auth}"
                          else:
                              text = h
                          if len(text) > 100:
                              text = text[:97] + "..."
                          if text:
                              print(f"[QuoteFetcher] Hitokoto -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] Hitokoto err ({type(e).__name__}), fallback to P2", flush=True)

                  # 2. P2: xygeng API (no artificial truncation under 100 chars)
                  try:
                      r = _req.Request("https://api.xygeng.cn/one", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          d = data.get("data")
                          raw = (d.get("content") if isinstance(d, dict) else "") or ""
                          text = _clean_text(raw)
                          if isinstance(d, dict):
                              auth = _clean_text(_format_author(d.get("name"), d.get("origin")))
                              if auth:
                                  for ch in ("\u3002", "\uff01", "!", "."):
                                      if text.endswith(ch):
                                          text = text[:-1]
                                  text = f"{text} \u2014\u2014 {auth}"
                          if len(text) > 100:
                              text = text[:97] + "..."
                          if text:
                              print(f"[QuoteFetcher] xygeng -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] xygeng err ({type(e).__name__}), fallback to P3", flush=True)

                  # 3. P3: SweetNothings
                  try:
                      r = _req.Request("https://api.lovelive.tools/api/SweetNothings", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          text = _clean_text(resp.read().decode("utf-8"))
                          if len(text) > 100:
                              text = text[:97] + "..."
                          if text:
                              print(f"[QuoteFetcher] SweetNothings -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] SweetNothings err ({type(e).__name__}), fallback to P4", flush=True)

                  # 4. P4: Iciba (keep bilingual if en + zh <= 100 chars)
                  try:
                      r = _req.Request("https://open.iciba.com/dsapi/", headers=headers)
                      with _req.urlopen(r, timeout=timeout) as resp:
                          data = _json.loads(resp.read().decode("utf-8"))
                          zh = _clean_text(data.get("note", ""))
                          en = _clean_text(data.get("content", ""))
                          text = f"{en}\uff08{zh}\uff09" if (en and zh and len(en) + len(zh) + 2 <= 100) else (zh or en)
                          if len(text) > 100:
                              text = text[:97] + "..."
                          if text:
                              print(f"[QuoteFetcher] Iciba -> {text}", flush=True)
                              return text
                  except Exception as e:
                      print(f"[QuoteFetcher] Iciba err ({type(e).__name__}), fallback to local pool", flush=True)

                  # 5. Offline Fallback Pool with Author/Source
                  fallback_pool = [
                      "\u53bb\u70ed\u7231\u751f\u6d3b\uff0c\u53bb\u5954\u8d74\u5c71\u6d77\u3002 \u2014\u2014 \u300a\u4eba\u6c11\u65e5\u62a5\u300b",
                      "\u613f\u4f60\u5386\u5c3d\u5343\u5e06\uff0c\u5f52\u6765\u4ecd\u662f\u5c11\u5e74\u3002 \u2014\u2014 \u51af\u5510",
                      "\u751f\u6d3b\u539f\u672c\u6c89\u95f7\uff0c\u4f46\u8dd1\u8d77\u6765\u5c31\u6709\u98ce\u3002 \u2014\u2014 \u300a\u5e73\u51e1\u7684\u4e16\u754c\u300b",
                      "\u65e5\u843d\u5c24\u5176\u6e29\u67d4\uff0c\u4eba\u95f4\u7686\u662f\u6d6a\u6f2b\u3002 \u2014\u2014 \u73b0\u4ee3\u968f\u7b14",
                      "\u77e5\u8db3\u4e14\u4e0a\u8fdb\uff0c\u6e29\u67d4\u4e14\u575a\u5b9a\u3002 \u2014\u2014 \u6cbb\u6108\u7cfb\u8bed\u5f55",
                      "\u6625\u6765\u590f\u5f80\uff0c\u79cb\u6536\u51ac\u85cf\uff0c\u6211\u4eec\u6765\u65e5\u65b9\u957f\u3002 \u2014\u2014 \u6c6a\u66fe\u797a",
                      "\u6ee1\u6000\u5e0c\u671b\uff0c\u5c31\u4f1a\u6240\u5411\u62ab\u9761\u3002 \u2014\u2014 \u5deb\u54f2",
                      "\u751f\u6d3b\u660e\u6717\uff0c\u4e07\u7269\u53ef\u7231\uff0c\u4eba\u95f4\u503c\u5f97\uff0c\u672a\u6765\u53ef\u671f\u3002 \u2014\u2014 \u5b63\u7fa1\u6797",
                      "\u4fdd\u6301\u70ed\u7231\uff0c\u5954\u8d74\u4e0b\u4e00\u573a\u5c71\u6d77\u3002 \u2014\u2014 \u300a\u4e2d\u56fd\u56fd\u5bb6\u5730\u7406\u300b",
                      "\u628a\u7ec6\u788e\u7684\u65e5\u5b50\u8fc7\u6210\u8bd7\uff0c\u7b80\u5355\u4e14\u6e29\u6696\u3002 \u2014\u2014 \u7b80\u5a9c",
                      "\u8ffd\u5149\u7684\u4eba\uff0c\u7ec8\u4f1a\u4e07\u4e08\u5149\u8292\u3002 \u2014\u2014 \u7ecf\u5178\u52b1\u5fd7\u8bed\u5f55",
                      "\u5fc3\u6709\u7e41\u82b1\uff0c\u4e00\u8def\u751f\u9999\u3002 \u2014\u2014 \u6cf0\u6208\u5c14"
                  ]
                  fb = random.choice(fallback_pool)
                  print(f"[QuoteFetcher] fallback -> {fb}", flush=True)
                  return fb

              _orig_send_message = _sender.send_message

              async def _patched_send_message(page, chat, message, stickers):
                  if message.type == "text" and message.content:
                      val = message.content
                      v_stripped = val.strip()
                      trigger_pattern = re.compile(r"\[(?:API|\u4e00\u8a00|\u91d1\u53e5|\u6bcf\u65e5\u4e00\u53e5)\]|\bAPI\b|\u4e00\u8a00|\u91d1\u53e5|\u6bcf\u65e5\u4e00\u53e5")
                      exact_matches = ("\u4e00\u8a00", "\u91d1\u53e5", "\u6bcf\u65e5\u4e00\u53e5", "API", "api", "[\u4e00\u8a00]", "[\u91d1\u53e5]", "[\u6bcf\u65e5\u4e00\u53e5]", "[API]")
                      if v_stripped in exact_matches or trigger_pattern.search(val):
                          q = _clean_text(_fetch_quote())
                          if v_stripped in exact_matches:
                              val = q
                          else:
                              val = _clean_text(trigger_pattern.sub(lambda _: q, val, count=1))
                          if len(val) > 100:
                              val = val[:97] + "..."
                          message = type(message)(type="text", content=val)
                          print(f"[HumanizeHook] Dynamic quote: {val}", flush=True)
                  return await _orig_send_message(page, chat, message, stickers)

              async def _patched_send_text(chat, content):
                  content = _clean_text(content)
                  if len(content) > 100:
                      content = content[:97] + "..."
                  editor = await chat.message_input()
                  page = editor.page
                  await editor.click()
                  await asyncio.sleep(random.uniform(0.6, 1.2))

                  # Dynamic typing cadence: humanized and responsive for up to 100 characters
                  speed = random.uniform(0.04, 0.08) if len(content) > 50 else random.uniform(0.09, 0.18)
                  p_speed = random.uniform(0.18, 0.30) if len(content) > 50 else random.uniform(0.30, 0.45)
                  for char in content:
                      await page.keyboard.insert_text(char)
                      if char in "\uff0c\u3002\uff01\uff1f\uff1b\u3001,.!?":
                          await asyncio.sleep(p_speed)
                      else:
                          await asyncio.sleep(speed)

                  try:
                      await page.wait_for_function(
                          r"""([txt]) => {
                              const es = [...document.querySelectorAll('[class*=messageEditor] [contenteditable=true], .messageEditorinputArea, [data-contents=true], .DraftEditor-root [contenteditable=true], [contenteditable=true], textarea')];
                              const target = [...txt].slice(0, 30).join('').replace(/\s+/g, ' ');
                              return es.some(e => ((e.innerText || e.textContent || e.value || '').replace(/\s+/g, ' ')).includes(target));
                          }""",
                          arg=[content],
                          timeout=5000,
                      )
                  except Exception as exc:
                      raise PageOperationError("Input not verified in editor") from exc

                  await asyncio.sleep(random.uniform(1.0, 1.8))

                  before = await _sender._mark_latest_outgoing_message(page)
                  await page.wait_for_timeout(300)
                  await _sender._trigger_send(page)
                  await _sender._confirm_outgoing_message(page, before, label="\u6587\u5b57", expected_text=content)

              _sender.send_message = _patched_send_message
              _sender.send_text = _patched_send_text
              print("[HumanizeHook] Mounted humanized sender hook successfully", flush=True)

          _install_playwright_proxy_hook()
          _install_humanized_sender_hook()
          EOF

          echo "PYTHONPATH=${HOOK_DIR}:${PYTHONPATH}" >> "$GITHUB_ENV"
          echo "LOCAL_XRAY_PROXY=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"

          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])" 2>/dev/null || true)
          if [ -n "$SITE_PKG" ] && [ -d "$SITE_PKG" ]; then
            cp "$HOOK_DIR/sitecustomize.py" "$SITE_PKG/sitecustomize.py"
          fi
          echo "sitecustomize.py 零侵入代理与拟人化钩子注入完成！"

      - name: Randomized execution jitter (07:50 - 07:52)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # 仅在每天定时触发时执行，随机等待 0 ~ 120 秒（在 07:50 到 07:52 之间随机拟人化执行）
          JITTER_SEC=$(( RANDOM % 121 ))
          echo "拟人化随机延时防风控：本次任务随机延后 ${JITTER_SEC} 秒后启动浏览器..."
          sleep "$JITTER_SEC"

      - name: Run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IS_DRY_RUN" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Stop Xray Proxy Tunnel
        if: always()
        run: |
          pkill -f "/tmp/xray/xray" || true

      - name: Encrypt diagnostics artifacts (7-Zip AES-256)
        if: failure()
        shell: bash
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          set -e
          # 1. 彻底移除包含 Cookie/网络请求头的 Playwright trace 抓包，防止凭据外泄
          rm -rf artifacts/traces

          # 2. 检查是否有需要加密上传的诊断文件
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "无诊断文件生成，跳过加密打包"
            exit 0
          fi

          # 3. 安全熔断：未配置密码则严禁明文上传
          if [ -z "$ARTIFACT_PASSWORD" ]; then
            echo "::warning::未检测到 ARTIFACT_PASSWORD 密钥，为防止明文泄露，已自动阻断附件上传！"
            rm -rf artifacts
            exit 0
          fi

          # 4. 确保 7-Zip (7z) 工具就绪
          if ! command -v 7z &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          fi

          # 5. 使用 7-Zip 进行 AES-256 全量加密打包（-mhe=on 开启文件名头部强加密）
          mkdir -p /tmp/encrypted_out
          7z a -t7z -p"$ARTIFACT_PASSWORD" -mhe=on -mx=9 /tmp/encrypted_out/diagnostics.7z ./artifacts/*
          
          # 清除原始明文目录
          rm -rf artifacts
          echo "诊断产物已成功通过 AES-256 强加密打包（文件名已隐藏）！"

      - name: Upload encrypted diagnostics
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: douyin-encrypted-diagnostics-${{ github.run_id }}
          path: /tmp/encrypted_out/diagnostics.7z
          if-no-files-found: ignore
          retention-days: 3
