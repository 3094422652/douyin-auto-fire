name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              print("未配置多账号 Secret，使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时存在"
                  )
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Start Xray Proxy Tunnel (Scheme B)
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          set -e
          if [ -z "$XRAY_CONFIG" ]; then
            echo "::error::未检测到 XRAY_CONFIG Secret，为防止原生机房 IP 暴露，任务已强制熔断终止！"
            exit 1
          fi

          echo "[1/3] 正在下载并解压 Xray-core..."
          wget -q -O /tmp/Xray-linux-64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o /tmp/Xray-linux-64.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

          echo "[2/3] 正在写入配置并启动本地 SOCKS5 隧道 (127.0.0.1:10808)..."
          echo "$XRAY_CONFIG" > /tmp/xray/config.json
          nohup /tmp/xray/xray run -c /tmp/xray/config.json >/tmp/xray/xray.log 2>&1 &
          sleep 3

          echo "[3/3] 正在校验代理隧道连通性与出口 IP..."
          if ! PROXY_IP=$(curl -sS --fail --max-time 15 --retry 2 --socks5-hostname 127.0.0.1:10808 https://api.ip.sb/ip); then
            echo "::error::Xray 代理隧道连接失败！以下为 Xray 运行日志："
            cat /tmp/xray/xray.log
            exit 1
          fi
          echo "代理隧道校验通过！当前加密出口 IP: ${PROXY_IP}"

      - name: Inject Zero-Intrusion Playwright Proxy Hook (sitecustomize.py)
        run: |
          set -e
          HOOK_DIR="/tmp/pw_proxy_hook"
          mkdir -p "$HOOK_DIR"

          cat << 'EOF' > "$HOOK_DIR/sitecustomize.py"
          import os
          import sys

          def _install_playwright_proxy_hook():
              proxy_url = os.environ.get("LOCAL_XRAY_PROXY", "socks5://127.0.0.1:10808").strip()
              if not proxy_url:
                  return
              try:
                  import playwright._impl._browser_type as _bt
              except ImportError:
                  return

              _orig_launch = _bt.BrowserType.launch
              _orig_launch_persistent = _bt.BrowserType.launch_persistent_context

              async def _patched_launch(self, *args, **kwargs):
                  if not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch 已强制绑定本地 Xray 隧道: {proxy_url}", flush=True)
                  return await _orig_launch(self, *args, **kwargs)

              async def _patched_launch_persistent(self, *args, **kwargs):
                  if not kwargs.get("proxy"):
                      kwargs["proxy"] = {"server": proxy_url}
                      print(f"[ProxyHook] BrowserType.launch_persistent_context 已强制绑定本地 Xray 隧道: {proxy_url}", flush=True)
                  return await _orig_launch_persistent(self, *args, **kwargs)

              _bt.BrowserType.launch = _patched_launch
              _bt.BrowserType.launch_persistent_context = _patched_launch_persistent

          _install_playwright_proxy_hook()
          EOF

          echo "PYTHONPATH=${HOOK_DIR}:${PYTHONPATH}" >> "$GITHUB_ENV"
          echo "LOCAL_XRAY_PROXY=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"

          SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])" 2>/dev/null || true)
          if [ -n "$SITE_PKG" ] && [ -d "$SITE_PKG" ]; then
            cp "$HOOK_DIR/sitecustomize.py" "$SITE_PKG/sitecustomize.py"
          fi
          echo "sitecustomize.py 零侵入代理钩子注入完成！"

      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
